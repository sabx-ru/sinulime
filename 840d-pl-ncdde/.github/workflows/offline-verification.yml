name: Offline verification
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify documented observed frames
        run: python3 tools/verify_frames.py
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Check Bash build-script syntax
        run: bash -n BUILD_DEBIAN.sh
